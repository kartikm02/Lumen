spring:
  application:
    name: lumen-api
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${LUMEN_JWT_ISSUER_URI}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  error:
    include-message: never
